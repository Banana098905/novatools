<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — タイムゾーン変換 (時差計算)</title>
  <meta name="description" content="日時を別のタイムゾーンに簡単変換。世界の主要タイムゾーン対応。無料・ログイン不要。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 560px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    .select-group { margin-bottom: 1rem; }
    label { color: #cbece6; font-size: 0.7rem; display: block; margin-bottom: 0.2rem; }
    select, input { width: 100%; background: rgba(20,30,40,0.7); border: 1px solid rgba(45,212,191,0.4); border-radius: 2rem; padding: 0.7rem; color: #e0f7f2; margin-bottom: 0.5rem; }
    .convert-btn { background: #1A8C7A; width: 100%; padding: 0.8rem; border-radius: 3rem; font-size: 1rem; font-weight: 600; color: white; cursor: pointer; border: none; margin: 1rem 0; }
    .result-area { background: rgba(0,0,0,0.35); border-radius: 1.5rem; padding: 1rem; margin-top: 1rem; text-align: center; }
    .result-time { font-size: 1.2rem; font-weight: 600; color: #e0f7f2; word-break: break-word; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">🌍 タイムゾーン変換 (時差計算)</div>
  <div class="select-group">
    <label>📅 変換する日時</label>
    <input type="datetime-local" id="sourceDateTime">
  </div>
  <div class="select-group">
    <label>🌎 変換元タイムゾーン</label>
    <select id="fromZone">
      <option value="Asia/Tokyo">日本 (JST / UTC+9)</option>
      <option value="UTC">UTC (協定世界時)</option>
      <option value="America/New_York">アメリカ東部 (EST/EDT)</option>
      <option value="America/Los_Angeles">アメリカ西部 (PST/PDT)</option>
      <option value="Europe/London">ロンドン (GMT/BST)</option>
      <option value="Europe/Paris">パリ (CET/CEST)</option>
      <option value="Asia/Shanghai">中国 (CST / UTC+8)</option>
      <option value="Australia/Sydney">シドニー (AEST/AEDT)</option>
    </select>
  </div>
  <div class="select-group">
    <label>🌍 変換先タイムゾーン</label>
    <select id="toZone">
      <option value="America/New_York">アメリカ東部 (EST/EDT)</option>
      <option value="America/Los_Angeles">アメリカ西部 (PST/PDT)</option>
      <option value="Asia/Tokyo">日本 (JST / UTC+9)</option>
      <option value="UTC">UTC (協定世界時)</option>
      <option value="Europe/London">ロンドン (GMT/BST)</option>
      <option value="Europe/Paris">パリ (CET/CEST)</option>
      <option value="Asia/Shanghai">中国 (CST / UTC+8)</option>
      <option value="Australia/Sydney">シドニー (AEST/AEDT)</option>
    </select>
  </div>
  <button class="convert-btn" id="convertBtn">🔄 変換する</button>
  <div class="result-area">
    <div class="result-time" id="resultTime">--:-- --</div>
    <div style="font-size:0.7rem; margin-top:0.5rem;" id="resultOffset"></div>
  </div>
  <div class="footer-note">夏時間 (DST) は自動反映されます</div>
</div>

<script>
  function convertTime() {
    const dateTimeStr = document.getElementById('sourceDateTime').value;
    if(!dateTimeStr) {
      document.getElementById('resultTime').innerText = "日時を選択してください";
      return;
    }
    const fromZone = document.getElementById('fromZone').value;
    const toZone = document.getElementById('toZone').value;
    // 元の日時を指定タイムゾーンとして解釈するためのDateオブジェクト生成
    // Intl.DateTimeFormatで指定ゾーンの日時をパースするのは難しいので、簡易的にUTCとして扱いオフセットを計算する方法
    // より確実: 一度fromZoneの日時をUTCタイムスタンプに変換してからtoZoneで表示
    // ここでは toLocaleString の timeZone オプションを使うため、DateオブジェクトをUTCとして解釈させる必要がある。
    // 入力された年月日時分をローカル（ブラウザのタイムゾーン）ではなく、fromZoneのタイムゾーンにあるものとして扱いたい。
    // 標準的な方法: 入力された文字列を once UTC と見なしてから、toZoneの文字列を生成するのは不正確。
    // 代わりに、fromZoneのオフセットを計算して調整する複雑な処理は避け、Dateオブジェクトをユーザーのローカルタイムゾーンで入力してもらい、
    // それを fromZone の時刻とみなすのは誤差が生じる。そこで、入力値をそのままブラウザのローカル時刻と見なしてから fromZone に変換する簡易版とする。
    // 正確な変換を求める場合は Moment.js や Intl の API を駆使するが、ここではシンプルに「指定した日時をブラウザのローカルタイムと仮定し、fromZoneとtoZoneの表示を変換する」。
    // 多くの利用ケースで十分。
    const localDate = new Date(dateTimeStr);
    if(isNaN(localDate.getTime())) {
      document.getElementById('resultTime').innerText = "無効な日時";
      return;
    }
    // fromZone での表示文字列を取得し、それをパースするのは複雑。ここでは fromZone のオフセットを算出して調整する方法。
    // 簡単のため、Intl.DateTimeFormat で fromZone の時刻文字列を取得し、それを new Date() でパースするのは危険。
    // より簡潔に：ユーザーが選択した「変換元タイムゾーン」が実際のブラウザのタイムゾーンと異なる場合を考慮すると難しい。
    // 今回は「変換元タイムゾーンにその日時があるとして、変換先タイムゾーンの時刻を計算する」実装をしっかり行う。
    // 正しい方法：指定された日時文字列を fromZone の時刻として解釈するため、そのタイムゾーンのオフセットを求め、UTCに変換してからtoZoneのオフセットを加える。
    const getOffset = (tz, date) => {
      const tzDate = new Date(date.toLocaleString('en-US', {timeZone: tz}));
      const utcDate = new Date(date.toLocaleString('en-US', {timeZone: 'UTC'}));
      return (tzDate.getTime() - utcDate.getTime()) / (1000*60);
    };
    const fromOffset = getOffset(fromZone, localDate);
    const toOffset = getOffset(toZone, localDate);
    const utcTime = localDate.getTime() - (fromOffset * 60 * 1000);
    const convertedTime = new Date(utcTime + (toOffset * 60 * 1000));
    const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: toZone };
    const formatter = new Intl.DateTimeFormat('ja-JP', options);
    const parts = formatter.formatToParts(convertedTime);
    const year = parts.find(p=>p.type==='year')?.value;
    const month = parts.find(p=>p.type==='month')?.value;
    const day = parts.find(p=>p.type==='day')?.value;
    const hour = parts.find(p=>p.type==='hour')?.value;
    const minute = parts.find(p=>p.type==='minute')?.value;
    const second = parts.find(p=>p.type==='second')?.value;
    const formatted = `${year}/${month}/${day} ${hour}:${minute}:${second}`;
    document.getElementById('resultTime').innerText = formatted;
    const offsetHours = toOffset / 60;
    const sign = offsetHours >= 0 ? '+' : '';
    document.getElementById('resultOffset').innerHTML = `UTC${sign}${offsetHours} (${toZone})`;
  }
  document.getElementById('convertBtn').addEventListener('click', convertTime);
  // 初期値として現在日時を設定
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth()+1).padStart(2,'0');
  const day = String(now.getDate()).padStart(2,'0');
  const hour = String(now.getHours()).padStart(2,'0');
  const minute = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('sourceDateTime').value = `${year}-${month}-${day}T${hour}:${minute}`;
  convertTime();
</script>
</body>
</html>
