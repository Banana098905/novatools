<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — 週番号計算 (今年の何週目か)</title>
  <meta name="description" content="指定した日付が年間で何週目かを計算。ISO週番号に対応。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 560px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    .date-group { margin: 1rem 0; }
    label { font-size: 0.7rem; color: #cbece6; display: block; margin-bottom: 0.2rem; }
    input { width: 100%; background: rgba(20,30,40,0.7); border: 1px solid rgba(45,212,191,0.4); border-radius: 2rem; padding: 0.7rem; color: #e0f7f2; }
    .result-area { background: rgba(0,0,0,0.35); border-radius: 1.5rem; padding: 1rem; margin: 1rem 0; text-align: center; }
    .week-number { font-size: 2.5rem; font-weight: 700; color: #e0f7f2; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">📆 週番号計算 (ISO週番号)</div>
  <div class="date-group"><label>日付を選択</label><input type="date" id="dateInput"></div>
  <div class="result-area"><div class="week-number" id="weekNumber">--</div><div id="yearInfo"></div></div>
  <div class="footer-note">ISO 8601に基づく週番号 (月曜始まり)</div>
</div>
<script>
  function getWeekNumber(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  }
  const dateInput = document.getElementById('dateInput');
  const weekSpan = document.getElementById('weekNumber');
  const yearInfo = document.getElementById('yearInfo');
  function updateWeek() {
    const date = new Date(dateInput.value);
    if (isNaN(date)) {
      weekSpan.innerText = '--';
      yearInfo.innerText = '';
      return;
    }
    const week = getWeekNumber(date);
    const year = date.getFullYear();
    weekSpan.innerText = week;
    yearInfo.innerText = `${year}年の第${week}週`;
  }
  const today = new Date().toISOString().split('T')[0];
  dateInput.value = today;
  dateInput.addEventListener('change', updateWeek);
  updateWeek();
</script>
</body>
</html>
