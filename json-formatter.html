<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — JSONフォーマッター (整形・圧縮)</title>
  <meta name="description" content="JSONを瞬時に整形／圧縮。バリデーション機能付き。無料・ログイン不要。開発者必須ツール。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 800px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { text-align: center; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; width: auto; margin: 0 auto 1rem; padding: 0.2rem 1rem; border-radius: 3rem; }
    textarea { width: 100%; background: rgba(10,18,25,0.8); border: 1px solid rgba(45,212,191,0.4); border-radius: 1.5rem; padding: 1rem; color: #e0f7f2; font-family: monospace; margin-bottom: 1rem; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; margin: 1rem 0; }
    .btn { background: #1A8C7A; border: none; padding: 0.6rem 1.2rem; border-radius: 2rem; color: white; cursor: pointer; }
    .status { background: rgba(0,0,0,0.3); border-radius: 2rem; padding: 0.5rem 1rem; margin-top: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; font-size: 0.7rem; }
    .valid-message { color: #7bdfc7; }
    .invalid-message { color: #ff9b7a; }
    .copy-notice { color: #b4d9d0; cursor: pointer; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">📐 JSON フォーマッター</div>
  <textarea id="jsonInput" rows="10" placeholder='{"name": "NovaTools","version": "1.0"}'></textarea>
  <div class="btn-group"><button class="btn" id="formatBtn">✨ 整形</button><button class="btn" id="minifyBtn">⚡ 圧縮</button><button class="btn" id="sampleBtn">📋 サンプル</button><button class="btn" id="clearBtn">🗑️ クリア</button></div>
  <div class="status"><span id="validationStatus">✅ JSONを入力してください</span><span id="copyStatus" class="copy-notice">📋 結果をコピー</span></div>
  <div class="footer-note">有効なJSONを入力して「整形」または「圧縮」を押す</div>
</div>
<script>
  const ta=document.getElementById('jsonInput'), valSpan=document.getElementById('validationStatus'), copySpan=document.getElementById('copyStatus');
  function validate(){try{JSON.parse(ta.value); ta.style.borderColor='rgba(45,212,191,0.4)'; valSpan.innerHTML='✅ 有効なJSON'; valSpan.className='valid-message'; return true;}catch(e){ta.style.borderColor='#ff7b5c'; valSpan.innerHTML=`❌ JSONエラー: ${e.message}`; valSpan.className='invalid-message'; return false;}}
  ta.oninput=validate;
  document.getElementById('formatBtn').onclick=()=>{try{let obj=JSON.parse(ta.value); ta.value=JSON.stringify(obj,null,2); validate();}catch(e){}};
  document.getElementById('minifyBtn').onclick=()=>{try{let obj=JSON.parse(ta.value); ta.value=JSON.stringify(obj); validate();}catch(e){}};
  document.getElementById('sampleBtn').onclick=()=>{ta.value=JSON.stringify({site:"NovaTools",tools:["タイマー","QR","要約"],version:"2.0"},null,2); validate();};
  document.getElementById('clearBtn').onclick=()=>{ta.value=''; validate();};
  copySpan.onclick=async()=>{let c=ta.value; if(!c.trim()){copySpan.innerHTML='⚠️ コピーする内容がありません'; setTimeout(()=>copySpan.innerHTML='📋 結果をコピー',1500); return;} await navigator.clipboard.writeText(c); copySpan.innerHTML='✅ コピーしました！'; setTimeout(()=>copySpan.innerHTML='📋 結果をコピー',2000);};
  document.getElementById('sampleBtn').click();
</script>
</body>
</html>
