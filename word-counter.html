<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — 文字数カウント (字数チェック)</title>
  <meta name="description" content="リアルタイムで文字数をカウント。空白の有無を切り替え、行数や単語数も表示。レポート・SNS投稿に便利。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 680px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { text-align: center; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; width: auto; margin: 0 auto 1rem; padding: 0.2rem 1rem; border-radius: 3rem; }
    textarea { width: 100%; background: rgba(20,30,40,0.7); border: 1px solid rgba(45,212,191,0.4); border-radius: 1.5rem; padding: 1rem; color: #e0f7f2; margin-bottom: 1rem; }
    .counter-grid { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; }
    .counter-card { flex: 1; background: rgba(0,0,0,0.35); border-radius: 2rem; padding: 0.8rem; text-align: center; color: #cbece6; }
    .counter-number { font-size: 2rem; font-weight: 700; color: #e0f7f2; }
    .options-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; background: rgba(0,0,0,0.3); border-radius: 2rem; padding: 0.6rem 1rem; margin: 0.8rem 0; color: #cbece6; }
    .btn { background: #1A8C7A; border: none; padding: 0.5rem 1rem; border-radius: 2rem; color: white; cursor: pointer; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">📝 リアルタイム文字数カウンター</div>
  <textarea id="textInput" rows="6" placeholder="ここにテキストを入力"></textarea>
  <div class="counter-grid">
    <div class="counter-card"><div>📊 文字数(空白含む)</div><div class="counter-number" id="charWithSpace">0</div></div>
    <div class="counter-card"><div>📝 文字数(空白除く)</div><div class="counter-number" id="charWithoutSpace">0</div></div>
    <div class="counter-card"><div>🔤 単語数</div><div class="counter-number" id="wordCount">0</div></div>
    <div class="counter-card"><div>📄 行数</div><div class="counter-number" id="lineCount">0</div></div>
  </div>
  <div class="options-row"><label><input type="checkbox" id="trimSpacesCheckbox"> ✨ 空白をトリムしてカウント</label><div><button class="btn" id="clearBtn">🗑️ クリア</button><button class="btn" id="sampleBtn">📋 サンプル</button></div></div>
  <div class="footer-note">空白含む：スペース・改行も1文字 | 空白除く：実際の文字のみ</div>
</div>
<script>
  const ta=document.getElementById('textInput'), cw=document.getElementById('charWithSpace'), cn=document.getElementById('charWithoutSpace'), wc=document.getElementById('wordCount'), lc=document.getElementById('lineCount'), trimChk=document.getElementById('trimSpacesCheckbox');
  function update(){let t=ta.value; let withSpace=t.length; let withoutSpace=t.replace(/[\s\n\r]/g,'').length; let lines=t.split(/\r?\n/).length; if(t.length===0)lines=0; let words=t.trim()?t.trim().split(/\s+/).length:0; if(trimChk.checked){let trimmed=t.trim(); cw.innerText=trimmed.length; cn.innerText=withoutSpace;}else{cw.innerText=withSpace; cn.innerText=withoutSpace;} wc.innerText=words; lc.innerText=lines;}
  ta.oninput=update; trimChk.onchange=update;
  document.getElementById('clearBtn').onclick=()=>{ta.value=''; update();};
  document.getElementById('sampleBtn').onclick=()=>{ta.value="今日はとても良い天気ですね。\n散歩に行くと、気持ちいい風が吹いていました。\nNovaToolsの文字数カウントツールは便利です。"; update();};
  update();
</script>
</body>
</html>
