<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — 暗記カードメーカー (単語帳アプリ)</title>
  <meta name="description" content="自分だけの暗記カードを作成。表・裏で学習。保存は自動。無料・ログイン不要。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 700px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    .mode-switch { display: flex; gap: 0.8rem; justify-content: center; margin-bottom: 1rem; }
    .mode-btn { background: rgba(30,40,50,0.8); border: none; padding: 0.4rem 1rem; border-radius: 2rem; color: #e0f7f2; cursor: pointer; }
    .mode-btn.active { background: #1A8C7A; }
    .card-area { background: rgba(0,0,0,0.35); border-radius: 2rem; padding: 2rem 1rem; text-align: center; margin-bottom: 1rem; min-height: 200px; display: flex; flex-direction: column; justify-content: center; }
    .card-question { font-size: 1.2rem; font-weight: 600; color: #e0f7f2; margin-bottom: 1rem; }
    .card-answer { font-size: 1rem; color: #b3f0e6; }
    .reveal-btn { background: #2d5f66; border: none; padding: 0.4rem 1rem; border-radius: 2rem; color: white; cursor: pointer; margin-top: 1rem; }
    .nav-buttons { display: flex; gap: 1rem; justify-content: center; margin: 1rem 0; }
    .add-card { margin-top: 1rem; border-top: 1px solid rgba(69,160,145,0.3); padding-top: 1rem; }
    .add-card input, .add-card textarea { width: 100%; background: rgba(20,30,40,0.7); border: 1px solid rgba(45,212,191,0.4); border-radius: 1.5rem; padding: 0.6rem; margin-bottom: 0.6rem; color: #e0f7f2; }
    .action-btn { background: #1A8C7A; border: none; padding: 0.5rem; border-radius: 2rem; color: white; cursor: pointer; width: 100%; }
    .delete-btn { background: #8f5e4a; margin-top: 0.5rem; }
    .card-list { max-height: 200px; overflow-y: auto; margin-top: 1rem; background: rgba(0,0,0,0.2); border-radius: 1rem; padding: 0.5rem; }
    .card-list-item { background: rgba(45,212,191,0.1); border-radius: 2rem; padding: 0.4rem 0.8rem; margin: 0.3rem 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">📇 暗記カードメーカー</div>
  
  <div class="mode-switch">
    <button class="mode-btn active" data-mode="learn">📖 学習モード</button>
    <button class="mode-btn" data-mode="edit">✏️ 編集モード</button>
  </div>

  <!-- 学習モード表示 -->
  <div id="learnMode" style="display:block;">
    <div class="card-area" id="cardArea">
      <div class="card-question" id="cardQuestion">カードを追加してください</div>
      <div class="card-answer" id="cardAnswer" style="display:none;"></div>
      <button class="reveal-btn" id="revealBtn">🔄 答えを見る</button>
    </div>
    <div class="nav-buttons">
      <button class="action-btn" id="prevBtn">◀ 前へ</button>
      <button class="action-btn" id="nextBtn">次へ ▶</button>
    </div>
    <div class="footer-note" id="cardCounter">0 / 0 枚</div>
  </div>

  <!-- 編集モード表示 -->
  <div id="editMode" style="display:none;">
    <div class="add-card">
      <input type="text" id="newQuestion" placeholder="質問（表）">
      <textarea id="newAnswer" rows="2" placeholder="答え（裏）"></textarea>
      <button class="action-btn" id="addCardBtn">➕ 新しいカードを追加</button>
    </div>
    <div class="card-list" id="cardList"></div>
    <button class="action-btn delete-btn" id="deleteAllBtn">🗑️ 全カード削除</button>
  </div>
  <div class="footer-note">データは自動保存されます | 学習モードで暗記しよう</div>
</div>

<script>
  let cards = [];           // {q, a}
  let currentIndex = 0;
  let mode = "learn";
  let isRevealed = false;

  // localStorageから読み込み
  function loadCards() {
    const stored = localStorage.getItem('novatools_flashcards');
    if(stored) {
      try { cards = JSON.parse(stored); } catch(e) { cards = []; }
    }
    if(!cards || cards.length===0) {
      cards = [
        {q:"NovaToolsのテーマカラーは？", a:"ティール（#2DD4BF）"},
        {q:"ポモドーロタイマーの集中時間は？", a:"25分"},
        {q:"JSONフォーマッターの機能は？", a:"整形・圧縮・バリデーション"}
      ];
      saveCards();
    }
    currentIndex = Math.min(currentIndex, cards.length-1);
    if(currentIndex<0 && cards.length>0) currentIndex=0;
    renderLearnMode();
    renderEditMode();
  }
  function saveCards() {
    localStorage.setItem('novatools_flashcards', JSON.stringify(cards));
  }
  function renderLearnMode() {
    if(cards.length===0) {
      document.getElementById('cardQuestion').innerText = "カードがありません。編集モードで追加してください";
      document.getElementById('cardAnswer').style.display = 'none';
      document.getElementById('revealBtn').style.display = 'none';
      document.getElementById('cardCounter').innerText = `0 / 0 枚`;
      return;
    }
    document.getElementById('revealBtn').style.display = 'block';
    const card = cards[currentIndex];
    document.getElementById('cardQuestion').innerText = card.q;
    document.getElementById('cardAnswer').innerText = card.a;
    document.getElementById('cardAnswer').style.display = 'none';
    isRevealed = false;
    document.getElementById('cardCounter').innerText = `${currentIndex+1} / ${cards.length} 枚`;
  }
  function revealAnswer() {
    if(cards.length===0) return;
    if(!isRevealed) {
      document.getElementById('cardAnswer').style.display = 'block';
      isRevealed = true;
    } else {
      document.getElementById('cardAnswer').style.display = 'none';
      isRevealed = false;
    }
  }
  function nextCard() {
    if(cards.length===0) return;
    currentIndex = (currentIndex + 1) % cards.length;
    renderLearnMode();
  }
  function prevCard() {
    if(cards.length===0) return;
    currentIndex = (currentIndex - 1 + cards.length) % cards.length;
    renderLearnMode();
  }
  function addCard() {
    const q = document.getElementById('newQuestion').value.trim();
    const a = document.getElementById('newAnswer').value.trim();
    if(!q || !a) { alert("質問と答えを両方入力してください"); return; }
    cards.push({q, a});
    saveCards();
    document.getElementById('newQuestion').value = '';
    document.getElementById('newAnswer').value = '';
    renderEditMode();
    if(mode==='learn') renderLearnMode();
  }
  function deleteCard(index) {
    cards.splice(index,1);
    saveCards();
    if(currentIndex >= cards.length && cards.length>0) currentIndex = cards.length-1;
    if(cards.length===0) currentIndex = 0;
    renderEditMode();
    if(mode==='learn') renderLearnMode();
  }
  function deleteAllCards() {
    if(confirm("全てのカードを削除しますか？")) {
      cards = [];
      saveCards();
      currentIndex = 0;
      renderEditMode();
      if(mode==='learn') renderLearnMode();
    }
  }
  function renderEditMode() {
    const container = document.getElementById('cardList');
    if(cards.length===0) {
      container.innerHTML = '<div style="color:#8db3c0; text-align:center;">カードがありません。追加してください</div>';
      return;
    }
    container.innerHTML = cards.map((card, idx) => `
      <div class="card-list-item">
        <span style="flex:1; overflow:hidden;">❓ ${card.q.substring(0,30)}</span>
        <button class="action-btn" style="width:auto; padding:0.2rem 0.6rem; background:#2d5f66;" data-del="${idx}">削除</button>
      </div>
    `).join('');
    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(btn.getAttribute('data-del'));
        deleteCard(idx);
      });
    });
  }
  function switchMode(newMode) {
    mode = newMode;
    document.querySelectorAll('.mode-btn').forEach(btn => {
      if(btn.getAttribute('data-mode') === mode) btn.classList.add('active');
      else btn.classList.remove('active');
    });
    if(mode==='learn') {
      document.getElementById('learnMode').style.display = 'block';
      document.getElementById('editMode').style.display = 'none';
      renderLearnMode();
    } else {
      document.getElementById('learnMode').style.display = 'none';
      document.getElementById('editMode').style.display = 'block';
      renderEditMode();
    }
  }

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.getAttribute('data-mode')));
  });
  document.getElementById('revealBtn').addEventListener('click', revealAnswer);
  document.getElementById('nextBtn').addEventListener('click', nextCard);
  document.getElementById('prevBtn').addEventListener('click', prevCard);
  document.getElementById('addCardBtn').addEventListener('click', addCard);
  document.getElementById('deleteAllBtn').addEventListener('click', deleteAllCards);

  loadCards();
  switchMode('learn');
</script>
</body>
</html>
