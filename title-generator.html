<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — AIタイトル生成 (ブログ・YouTube向け)</title>
  <meta name="description" content="キーワードから魅力的なタイトルを自動生成。ブログ・YouTube・SNSに最適。無料・ログイン不要。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 680px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    textarea { width: 100%; background: rgba(20,30,40,0.7); border: 1px solid rgba(45,212,191,0.4); border-radius: 1.5rem; padding: 1rem; font-size: 0.9rem; color: #e0f7f2; margin-bottom: 1rem; }
    .generate-btn { background: #1A8C7A; width: 100%; padding: 0.9rem; border-radius: 3rem; font-size: 1rem; font-weight: 600; color: white; cursor: pointer; border: none; margin-bottom: 1rem; }
    .title-list { background: rgba(0,0,0,0.3); border-radius: 1.5rem; padding: 1rem; }
    .title-item { background: rgba(45,212,191,0.1); border-radius: 2rem; padding: 0.8rem; margin-bottom: 0.8rem; color: #e0f7f2; word-break: break-word; border-left: 3px solid #2DD4BF; }
    .copy-title { background: #2d5f66; border: none; padding: 0.2rem 0.8rem; border-radius: 2rem; color: white; font-size: 0.7rem; cursor: pointer; margin-top: 0.5rem; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">✨ AIタイトルジェネレーター</div>
  <textarea id="keywordInput" rows="3" placeholder="例：プログラミング 初心者 学習方法"></textarea>
  <button class="generate-btn" id="generateBtn">🎯 タイトルを生成</button>
  <div class="title-list" id="titleList">
    <div class="title-item">💡 キーワードを入力して「生成」を押してください</div>
  </div>
  <div class="footer-note">キーワード（カンマ区切り可）から最大6つのタイトル候補を生成</div>
</div>
<script>
  const templates = [
    (kw) => `${kw}完全ガイド`,
    (kw) => `初心者でもわかる${kw}`,
    (kw) => `${kw}の教科書`,
    (kw) => `【保存版】${kw}まとめ`,
    (kw) => `${kw} 10選`,
    (kw) => `今すぐ始める${kw}`,
    (kw) => `${kw}入門`,
    (kw) => `${kw}のメリット・デメリット`,
    (kw) => `${kw}をマスターする5つのステップ`,
    (kw) => `なぜ${kw}が重要なのか？`
  ];
  function generateTitles(keyword) {
    let kw = keyword.trim();
    if (kw === "") return ["⚠️ キーワードを入力してください"];
    // カンマがある場合は最初のキーワードを使う
    if (kw.includes(",")) kw = kw.split(",")[0].trim();
    // 6つランダムに選出（重複なし）
    const shuffled = [...templates];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const selected = shuffled.slice(0, 6);
    return selected.map(fn => fn(kw));
  }
  function render() {
    const keyword = document.getElementById('keywordInput').value;
    const titles = generateTitles(keyword);
    const container = document.getElementById('titleList');
    container.innerHTML = titles.map(title => `
      <div class="title-item">
        <div>📌 ${title}</div>
        <button class="copy-title" data-title="${title.replace(/"/g, '&quot;')}">📋 コピー</button>
      </div>
    `).join('');
    document.querySelectorAll('.copy-title').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const text = btn.getAttribute('data-title');
        await navigator.clipboard.writeText(text);
        alert('コピーしました');
      });
    });
  }
  document.getElementById('generateBtn').addEventListener('click', render);
  // 初期表示
  render();
</script>
</body>
</html>
