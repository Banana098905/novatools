<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — マウステスター (クリック・ホイール動作確認)</title>
  <meta name="description" content="マウスの左クリック・右クリック・ホイールの動作をリアルタイムで確認。ゲーム前の動作チェックに。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 700px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    .test-area { width: 100%; min-height: 250px; background: rgba(45,212,191,0.08); border: 3px dashed rgba(45,212,191,0.4); border-radius: 2rem; display: flex; align-items: center; justify-content: center; margin: 1rem 0; cursor: pointer; transition: 0.1s; }
    .test-area:active { transform: scale(0.99); }
    .test-text { text-align: center; color: #b3f0e6; font-size: 1rem; }
    .click-counter { display: flex; gap: 1rem; justify-content: center; margin: 1rem 0; flex-wrap: wrap; }
    .counter-card { background: rgba(0,0,0,0.3); border-radius: 1.5rem; padding: 0.8rem 1.2rem; text-align: center; }
    .counter-number { font-size: 1.8rem; font-weight: 700; color: #e0f7f2; }
    .log-area { background: rgba(0,0,0,0.35); border-radius: 1.5rem; padding: 1rem; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; }
    .log-entry { color: #cbece6; border-bottom: 1px solid rgba(45,212,191,0.2); padding: 0.2rem 0; }
    .reset-btn { background: #2d5f66; border: none; padding: 0.4rem 1rem; border-radius: 2rem; color: white; cursor: pointer; margin-top: 0.5rem; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">🖱️ マウステスター</div>
  <div class="test-area" id="testArea">
    <div class="test-text">🖱️ ここでクリック・ホイールをテスト<br>左クリック / 右クリック / ホイール</div>
  </div>
  <div class="click-counter">
    <div class="counter-card"><div>左クリック</div><div class="counter-number" id="leftCount">0</div></div>
    <div class="counter-card"><div>右クリック</div><div class="counter-number" id="rightCount">0</div></div>
    <div class="counter-card"><div>ホイール</div><div class="counter-number" id="wheelCount">0</div></div>
  </div>
  <div class="log-area" id="logArea"></div>
  <button class="reset-btn" id="resetBtn">🔄 カウンターリセット</button>
  <div class="footer-note">動作確認用 | 右クリックも検出します</div>
</div>
<script>
  let leftClicks = 0, rightClicks = 0, wheelClicks = 0;
  const leftSpan = document.getElementById('leftCount');
  const rightSpan = document.getElementById('rightCount');
  const wheelSpan = document.getElementById('wheelCount');
  const logArea = document.getElementById('logArea');
  const testArea = document.getElementById('testArea');
  function addLog(msg) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerText = `${new Date().toLocaleTimeString()} : ${msg}`;
    logArea.insertBefore(entry, logArea.firstChild);
    if(logArea.children.length > 20) logArea.removeChild(logArea.lastChild);
  }
  testArea.addEventListener('click', (e) => {
    leftClicks++;
    leftSpan.innerText = leftClicks;
    addLog(`🖱️ 左クリック (X:${e.clientX}, Y:${e.clientY})`);
  });
  testArea.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    rightClicks++;
    rightSpan.innerText = rightClicks;
    addLog(`🖱️ 右クリック (X:${e.clientX}, Y:${e.clientY})`);
  });
  testArea.addEventListener('wheel', (e) => {
    e.preventDefault();
    wheelClicks++;
    wheelSpan.innerText = wheelClicks;
    const direction = e.deltaY > 0 ? '下 (スクロールダウン)' : '上 (スクロールアップ)';
    addLog(`🖱️ ホイール: ${direction}`);
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    leftClicks = 0; rightClicks = 0; wheelClicks = 0;
    leftSpan.innerText = '0'; rightSpan.innerText = '0'; wheelSpan.innerText = '0';
    addLog('🔄 カウンターをリセットしました');
  });
</script>
</body>
</html>
