<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — Ping疎通チェック (簡易)</title>
  <meta name="description" content="指定したホストへの応答時間を簡易測定。ネットワーク疎通確認に。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 560px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    .input-group { margin: 1rem 0; }
    input { width: 100%; background: rgba(20,30,40,0.7); border: 1px solid rgba(45,212,191,0.4); border-radius: 2rem; padding: 0.8rem; color: #e0f7f2; text-align: center; }
    .result-area { background: rgba(0,0,0,0.35); border-radius: 1.5rem; padding: 1rem; margin: 1rem 0; text-align: center; }
    .ping-result { font-size: 1.2rem; font-weight: 600; color: #e0f7f2; }
    .ping-btn { background: #1A8C7A; border: none; width: 100%; padding: 0.8rem; border-radius: 3rem; font-size: 1rem; font-weight: 600; color: white; cursor: pointer; margin: 0.5rem 0; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">📡 Ping疎通チェック</div>
  <div class="input-group">
    <input type="text" id="hostInput" placeholder="ホスト名 or IPアドレス" value="google.com">
  </div>
  <button class="ping-btn" id="pingBtn">🔍 Pingを実行</button>
  <div class="result-area">
    <div class="ping-result" id="pingResult">ここに結果が表示されます</div>
  </div>
  <div class="footer-note">※ HTTPSリクエストによる簡易測定です。実際のICMP Pingとは異なります。</div>
</div>
<script>
  const hostInput = document.getElementById('hostInput');
  const pingBtn = document.getElementById('pingBtn');
  const pingResult = document.getElementById('pingResult');
  async function pingHost(host) {
    const url = `https://${host}/favicon.ico`;
    const startTime = performance.now();
    try {
      await fetch(url, { mode: 'no-cors', cache: 'no-store' });
      const endTime = performance.now();
      const ms = (endTime - startTime).toFixed(0);
      pingResult.innerHTML = `✅ 応答あり (${ms} ms)<br>ホスト: ${host}`;
    } catch (error) {
      pingResult.innerHTML = `❌ タイムアウトまたは到達不能<br>ホスト: ${host}`;
    }
  }
  pingBtn.addEventListener('click', () => {
    let host = hostInput.value.trim();
    if (!host) host = 'google.com';
    pingResult.innerHTML = '🔄 測定中...';
    pingHost(host);
  });
  pingBtn.click();
</script>
</body>
</html>
