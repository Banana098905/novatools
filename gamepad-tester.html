<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — ゲームパッドテスター (コントローラー動作確認)</title>
  <meta name="description" content="ゲームパッドのボタン・スティック入力をリアルタイム表示。PCゲーム前の動作チェックに。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 700px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    .status-area { background: rgba(0,0,0,0.3); border-radius: 1.5rem; padding: 1rem; text-align: center; margin-bottom: 1rem; }
    .status-connected { color: #7bdfc7; font-weight: bold; }
    .status-disconnected { color: #ff9b7a; }
    .button-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; margin: 1rem 0; }
    .button-card { background: rgba(30,40,50,0.8); border-radius: 1rem; padding: 0.6rem; text-align: center; transition: 0.05s; }
    .button-card.active { background: #1A8C7A; transform: scale(0.96); }
    .button-name { font-size: 0.7rem; color: #b3f0e6; }
    .axis-area { background: rgba(0,0,0,0.3); border-radius: 1.5rem; padding: 0.8rem; margin-top: 1rem; }
    .axis-row { display: flex; justify-content: space-between; margin: 0.3rem 0; font-size: 0.7rem; color: #cbece6; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">🎮 ゲームパッドテスター</div>
  <div class="status-area" id="statusArea">🔌 コントローラーを接続してください</div>
  <div class="button-grid" id="buttonGrid"></div>
  <div class="axis-area" id="axisArea"></div>
  <div class="footer-note">XInput/DirectInput対応コントローラー | ボタンを押すと反応</div>
</div>
<script>
  const buttonNames = ['A','B','X','Y','LB','RB','LT','RT','Back','Start','L3','R3','Up','Down','Left','Right'];
  const container = document.getElementById('buttonGrid');
  const statusDiv = document.getElementById('statusArea');
  const axisDiv = document.getElementById('axisArea');
  const buttonElements = {};
  buttonNames.forEach(name => {
    const div = document.createElement('div');
    div.className = 'button-card';
    div.innerHTML = `<div class="button-name">${name}</div><div>⬤</div>`;
    div.id = `btn-${name}`;
    container.appendChild(div);
    buttonElements[name] = div;
  });
  let gamepadConnected = false;
  function updateGamepad() {
    const gamepads = navigator.getGamepads();
    const gp = gamepads[0];
    if(!gp) {
      if(gamepadConnected) {
        statusDiv.innerHTML = '❌ コントローラーが切断されました';
        statusDiv.className = 'status-area status-disconnected';
        gamepadConnected = false;
      }
      requestAnimationFrame(updateGamepad);
      return;
    }
    if(!gamepadConnected) {
      statusDiv.innerHTML = '✅ コントローラー接続中';
      statusDiv.className = 'status-area status-connected';
      gamepadConnected = true;
    }
    // ボタン状態更新 (標準的なマッピング)
    const btnMap = [0:'A',1:'B',2:'X',3:'Y',4:'LB',5:'RB',6:'LT',7:'RT',8:'Back',9:'Start',10:'L3',11:'R3',12:'Up',13:'Down',14:'Left',15:'Right'];
    for(let i=0; i<gp.buttons.length && i<=15; i++) {
      const btnName = btnMap[i];
      if(btnName && buttonElements[btnName]) {
        if(gp.buttons[i].pressed) buttonElements[btnName].classList.add('active');
        else buttonElements[btnName].classList.remove('active');
      }
    }
    // アナログスティック表示
    const axes = gp.axes;
    let axisHtml = '<div style="font-size:0.7rem; margin-bottom:0.3rem;">🎮 アナログスティック</div>';
    if(axes.length >= 2) axisHtml += `<div class="axis-row">左スティック X: ${axes[0].toFixed(3)} | Y: ${axes[1].toFixed(3)}</div>`;
    if(axes.length >= 4) axisHtml += `<div class="axis-row">右スティック X: ${axes[2].toFixed(3)} | Y: ${axes[3].toFixed(3)}</div>`;
    if(axes.length >= 6) axisHtml += `<div class="axis-row">LT/RT: ${axes[5].toFixed(3)}</div>`;
    axisDiv.innerHTML = axisHtml;
    requestAnimationFrame(updateGamepad);
  }
  window.addEventListener('gamepadconnected', () => { updateGamepad(); });
  window.addEventListener('gamepaddisconnected', () => { updateGamepad(); });
  updateGamepad();
</script>
</body>
</html>
