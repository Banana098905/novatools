<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — 言語検出 (簡易テキスト言語判定)</title>
  <meta name="description" content="テキストを入力すると、どの言語で書かれているかを簡易判定。日本語・英語・中国語・韓国語など対応。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 680px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    textarea { width: 100%; background: rgba(20,30,40,0.7); border: 1px solid rgba(45,212,191,0.4); border-radius: 1.5rem; padding: 1rem; color: #e0f7f2; resize: vertical; margin-bottom: 1rem; }
    .detect-btn { background: #1A8C7A; width: 100%; padding: 0.8rem; border-radius: 3rem; font-size: 1rem; font-weight: 600; color: white; cursor: pointer; border: none; margin-bottom: 1rem; }
    .result-area { background: rgba(0,0,0,0.35); border-radius: 1.5rem; padding: 1rem; text-align: center; }
    .lang-name { font-size: 1.5rem; font-weight: 700; color: #e0f7f2; margin-bottom: 0.3rem; }
    .confidence { font-size: 0.8rem; color: #b3f0e6; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">🌐 言語検出 (簡易版)</div>
  <textarea id="inputText" rows="5" placeholder="テキストを入力すると言語を判定します。例：Bonjour tout le monde"></textarea>
  <button class="detect-btn" id="detectBtn">🔍 言語を検出</button>
  <div class="result-area">
    <div class="lang-name" id="langName">--</div>
    <div class="confidence" id="confidence">テキストを入力してください</div>
  </div>
  <div class="footer-note">※簡易的な統計ベースです。短い文や特殊な文では誤判定することがあります。</div>
</div>
<script>
  // 簡易言語判定：Unicode範囲と頻出文字でざっくり判定
  function detectLanguage(text) {
    if (!text.trim()) return { lang: "不明", confidence: 0 };
    // 各種文字のカウント
    let counts = { ja:0, zh:0, ko:0, ru:0, ar:0, en:0, fr:0, de:0, es:0 };
    for (let ch of text) {
      const code = ch.charCodeAt(0);
      if (code >= 0x3040 && code <= 0x309F) counts.ja++;      // ひらがな
      else if (code >= 0x30A0 && code <= 0x30FF) counts.ja++; // カタカナ
      else if ((code >= 0x4E00 && code <= 0x9FFF)) {
        // CJK統合漢字 – 日本語・中国語・韓国語の漢字
        // 周囲の文字で判断（簡易）
        counts.zh++; counts.ja++; // 両方に加算するが後で調整
      }
      else if (code >= 0xAC00 && code <= 0xD7AF) counts.ko++; // ハングル
      else if (code >= 0x0400 && code <= 0x04FF) counts.ru++; // キリル文字
      else if (code >= 0x0600 && code <= 0x06FF) counts.ar++; // アラビア文字
      else if ((code >= 0x0041 && code <= 0x005A) || (code >= 0x0061 && code <= 0x007A)) {
        // ラテン文字 – 英語/フランス語/ドイツ語/スペイン語の区別は単語単位で簡易
        counts.en++;
        // アクセント付きなどは簡易のため無視
      }
    }
    // ひらがな/カタカナが多ければ日本語
    if (counts.ja > text.length*0.1) return { lang: "日本語", confidence: 85 };
    if (counts.ko > text.length*0.1) return { lang: "韓国語", confidence: 85 };
    if (counts.ru > text.length*0.1) return { lang: "ロシア語", confidence: 80 };
    if (counts.ar > text.length*0.1) return { lang: "アラビア語", confidence: 80 };
    // 中国語（漢字主体でひらがな・カタカナ・ハングルが少ない）
    if (counts.zh > text.length*0.2 && counts.ja < text.length*0.05 && counts.ko < text.length*0.05) {
      return { lang: "中国語", confidence: 75 };
    }
    // 英語（ラテン文字が大部分）
    if (counts.en > text.length*0.7) return { lang: "英語", confidence: 70 };
    // その他ラテン系言語は簡易に「ラテン系言語」と表示
    if (counts.en > text.length*0.3) return { lang: "ラテン系言語 (英語/フランス語/ドイツ語など)", confidence: 50 };
    return { lang: "不明（その他）", confidence: 30 };
  }
  function updateDetection() {
    const text = document.getElementById('inputText').value;
    const result = detectLanguage(text);
    document.getElementById('langName').innerText = result.lang;
    document.getElementById('confidence').innerHTML = `信頼度: ${result.confidence}% (目安)`;
  }
  document.getElementById('detectBtn').addEventListener('click', updateDetection);
  // 初期サンプルを設定
  document.getElementById('inputText').value = "こんにちは、今日はいい天気ですね。";
  updateDetection();
</script>
</body>
</html>
