<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — 画像圧縮 (無料・高画質維持)</title>
  <meta name="description" content="PNG・JPEG画像をブラウザ上で圧縮。画質スライダーで調整、圧縮前後のサイズ比較。ログイン不要・高速。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 680px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { text-align: center; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; width: auto; margin: 0 auto 1rem; padding: 0.2rem 1rem; border-radius: 3rem; }
    .dropzone { background: rgba(0,0,0,0.35); border: 2px dashed rgba(45,212,191,0.5); border-radius: 2rem; padding: 1.5rem; text-align: center; cursor: pointer; margin-bottom: 1rem; color: #b8e2da; }
    .preview-area { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin: 1rem 0; }
    .preview-card { flex: 1; background: rgba(0,0,0,0.3); border-radius: 1.5rem; padding: 0.8rem; text-align: center; color: #cbece6; }
    .preview-card img { max-width: 100%; max-height: 150px; border-radius: 1rem; }
    .quality-control { background: rgba(0,0,0,0.3); border-radius: 2rem; padding: 0.8rem 1rem; margin: 1rem 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; color: #cbece6; }
    .download-btn { background: #1A8C7A; width: 100%; padding: 0.9rem; border-radius: 3rem; font-size: 1rem; font-weight: 600; color: white; cursor: pointer; margin: 0.5rem 0; border: none; }
    .download-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">🖼️ 画像圧縮・軽量化 (JPEG/PNG)</div>
  <div class="dropzone" id="dropzone"><p>📸 クリックまたは画像をドロップ</p><p class="small">PNG / JPEG / WebP</p><input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none;"></div>
  <div class="preview-area" id="previewArea" style="display:none;">
    <div class="preview-card"><h4>元の画像</h4><img id="originalImg"><div id="originalSize"></div></div>
    <div class="preview-card"><h4>圧縮後</h4><img id="compressedImg"><div id="compressedSize"></div><div id="savingBadge"></div></div>
  </div>
  <div class="quality-control"><span>🎚️ 圧縮レベル</span><input type="range" id="qualitySlider" min="10" max="100" value="75"><span id="qualityValue">75%</span></div>
  <button class="download-btn" id="downloadBtn" disabled>💾 圧縮画像をダウンロード</button>
  <div class="footer-note">画像はサーバーに送信されません (完全ブラウザ処理)</div>
</div>
<script>
  let currentFile=null, compressedBlob=null, origUrl=null, compUrl=null;
  function formatBytes(b){if(b===0)return'0 B';const k=1024,i=Math.floor(Math.log(b)/Math.log(k));return parseFloat((b/Math.pow(k,i)).toFixed(1))+' '+['B','KB','MB'][i];}
  async function compress(file,q){return new Promise((resolve)=>{let r=new FileReader(); r.onload=e=>{let img=new Image(); img.onload=()=>{let c=document.createElement('canvas'); c.width=img.width; c.height=img.height; c.getContext('2d').drawImage(img,0,0); let mime=file.type==='image/png'?'image/png':'image/jpeg'; c.toBlob(b=>resolve(b),mime,q/100);}; img.src=e.target.result;}; r.readAsDataURL(file);});}
  async function process(file){currentFile=file; if(origUrl)URL.revokeObjectURL(origUrl); origUrl=URL.createObjectURL(file); document.getElementById('originalImg').src=origUrl; document.getElementById('originalSize').innerText=formatBytes(file.size); let blob=await compress(file,parseInt(qualitySlider.value)); compressedBlob=blob; if(compUrl)URL.revokeObjectURL(compUrl); compUrl=URL.createObjectURL(blob); document.getElementById('compressedImg').src=compUrl; document.getElementById('compressedSize').innerText=formatBytes(blob.size); let saving=((file.size-blob.size)/file.size*100).toFixed(1); document.getElementById('savingBadge').innerHTML=`📉 ${saving}% 削減`; if(saving<0)document.getElementById('savingBadge').innerHTML=`⚠️ サイズ増`; document.getElementById('previewArea').style.display='flex'; document.getElementById('downloadBtn').disabled=false;}
  async function recompress(){if(!currentFile)return;let blob=await compress(currentFile,parseInt(qualitySlider.value)); compressedBlob=blob; if(compUrl)URL.revokeObjectURL(compUrl); compUrl=URL.createObjectURL(blob); document.getElementById('compressedImg').src=compUrl; document.getElementById('compressedSize').innerText=formatBytes(blob.size); let saving=((currentFile.size-blob.size)/currentFile.size*100).toFixed(1); document.getElementById('savingBadge').innerHTML=`📉 ${saving}% 削減`; if(saving<0)document.getElementById('savingBadge').innerHTML=`⚠️ サイズ増`;}
  const drop=document.getElementById('dropzone'), fileInput=document.getElementById('fileInput'), quality=document.getElementById('qualitySlider'), qualVal=document.getElementById('qualityValue');
  drop.onclick=()=>fileInput.click(); drop.ondragover=e=>e.preventDefault(); drop.ondrop=e=>{e.preventDefault(); let f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/'))process(f);};
  fileInput.onchange=e=>{if(e.target.files[0])process(e.target.files[0]);};
  quality.oninput=()=>{qualVal.innerText=quality.value+'%'; if(currentFile)recompress();};
  document.getElementById('downloadBtn').onclick=()=>{if(compressedBlob){let a=document.createElement('a');a.download='compressed.jpg';a.href=URL.createObjectURL(compressedBlob);a.click();}};
</script>
</body>
</html>
