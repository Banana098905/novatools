<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>おみくじ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; padding:1rem; }
    .glass-card { max-width:500px; width:100%; background:rgba(12,18,28,0.58); backdrop-filter:blur(16px); border-radius:3rem; padding:2rem 1.5rem; box-shadow:0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display:inline-block; margin-bottom:1rem; background:rgba(45,212,191,0.15); color:#8dcfc3; text-decoration:none; padding:0.3rem 1rem; border-radius:2rem; font-size:0.8rem; transition:0.2s; }
    .home-link:hover { background:#2DD4BF; color:#e0f7f2; }
    .brand { text-align:center; font-size:1rem; font-weight:500; background:linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:1rem; }
    .badge { text-align:center; font-size:0.75rem; text-transform:uppercase; letter-spacing:2px; color:#7bd5e8; background:rgba(45,212,191,0.12); display:inline-block; width:auto; margin:0 auto 1rem; padding:0.2rem 1rem; border-radius:3rem; }
    .result { background:rgba(0,0,0,0.35); border-radius:1.5rem; padding:1rem; text-align:center; margin-bottom:1rem; }
    .fortune-name { font-size:2rem; font-weight:700; color:#e0f7f2; margin-bottom:0.5rem; }
    .fortune-message { font-size:0.8rem; color:#b3f0e6; }
    button { background:#1A8C7A; border:none; width:100%; padding:0.8rem; border-radius:2rem; color:white; font-size:1rem; font-weight:600; cursor:pointer; transition:0.2s; }
    button:hover { background:#2BBBA5; transform:translateY(-2px); }
    .footer-note { text-align:center; font-size:0.6rem; opacity:0.5; margin-top:1rem; color:#8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">🎋 おみくじ</div>
  <div class="result"><div class="fortune-name" id="fortuneName">大吉</div><div class="fortune-message" id="fortuneMsg"></div></div>
  <button id="drawBtn">🎲 引く</button>
  <div class="footer-note">今日の運勢</div>
</div>
<script>
  const fortunes = [
    { name:"大吉", msg:"すべてがうまくいく日です。新しい挑戦にGO！" },
    { name:"中吉", msg:"安定した運気。計画を進めるのに良い日。" },
    { name:"小吉", msg:"少しづつ良いことが。周囲に感謝を。" },
    { name:"吉", msg:"平凡だけど悪くない。コツコツ努力を。" },
    { name:"末吉", msg:"後から良い結果が。焦らずに。" },
    { name:"凶", msg:"トラブル注意。冷静に対処を。" },
    { name:"大凶", msg:"最大限の注意を。無理は禁物。" }
  ];
  document.getElementById('drawBtn').onclick = () => {
    const f = fortunes[Math.floor(Math.random() * fortunes.length)];
    document.getElementById('fortuneName').innerText = f.name;
    document.getElementById('fortuneMsg').innerText = f.msg;
  };
  document.getElementById('drawBtn').click();
</script>
</body>
</html>
