<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — カラーコードジェネレーター (カラーピッカー)</title>
  <meta name="description" content="色を選ぶだけでHEX・RGB・HSLを表示。ランダムカラー生成・補色表示・ワンクリックコピー。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 560px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { text-align: center; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; width: auto; margin: 0 auto 1rem; padding: 0.2rem 1rem; border-radius: 3rem; }
    .color-preview { width: 100%; height: 120px; border-radius: 2rem; margin-bottom: 1rem; }
    .picker-row { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); border-radius: 2rem; padding: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; color: #cbece6; }
    .code-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.35); border-radius: 2rem; padding: 0.6rem 1rem; margin: 0.5rem 0; flex-wrap: wrap; gap: 0.5rem; color: #e0f7f2; }
    .copy-code-btn { background: #1A8C7A; border: none; padding: 0.3rem 0.8rem; border-radius: 2rem; color: white; cursor: pointer; }
    .complementary { background: rgba(0,0,0,0.3); border-radius: 1.8rem; padding: 0.8rem; margin-top: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; color: #cbece6; }
    .complementary-color { width: 40px; height: 40px; border-radius: 1rem; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">🎨 カラーコードジェネレーター</div>
  <div class="color-preview" id="colorPreview" style="background:#2DD4BF"></div>
  <div class="picker-row"><span>🎚️ カラーピッカー</span><input type="color" id="colorPicker" value="#2DD4BF"><button id="randomColorBtn" class="copy-code-btn">🎲 ランダム</button></div>
  <div class="code-item"><span>HEX</span><span id="hexValue">#2DD4BF</span><button class="copy-code-btn" data-type="hex">コピー</button></div>
  <div class="code-item"><span>RGB</span><span id="rgbValue">rgb(45,212,191)</span><button class="copy-code-btn" data-type="rgb">コピー</button></div>
  <div class="code-item"><span>HSL</span><span id="hslValue">hsl(171,66%,50%)</span><button class="copy-code-btn" data-type="hsl">コピー</button></div>
  <div class="complementary"><span>🔄 補色</span><div class="complementary-color" id="compColor"></div><span id="compHex">#2DD4BF</span><button id="copyCompBtn" class="copy-code-btn">コピー</button></div>
  <div class="footer-note">HEX/RGB/HSLをクリックでコピー | ランダムボタンで偶然の色</div>
</div>
<script>
  function hexToRgb(hex){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return{r,g,b};}
  function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;let max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2; if(max===min)h=s=0; else{let d=max-min; s=l>0.5?d/(2-max-min):d/(max+min); if(max===r)h=(g-b)/d+(g<b?6:0); else if(max===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60;} return{h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)};}
  function hslToRgb(h,s,l){h%=360;s/=100;l/=100;let c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2; let r1,g1,b1; if(h<60)[r1,g1,b1]=[c,x,0]; else if(h<120)[r1,g1,b1]=[x,c,0]; else if(h<180)[r1,g1,b1]=[0,c,x]; else if(h<240)[r1,g1,b1]=[0,x,c]; else if(h<300)[r1,g1,b1]=[x,0,c]; else[r1,g1,b1]=[c,0,x]; return{r:Math.round((r1+m)*255),g:Math.round((g1+m)*255),b:Math.round((b1+m)*255)};}
  function getComplementary(hex){let rgb=hexToRgb(hex),hsl=rgbToHsl(rgb.r,rgb.g,rgb.b); let newHue=(hsl.h+180)%360; let compRgb=hslToRgb(newHue,hsl.s,hsl.l); return'#'+((1<<24)+(compRgb.r<<16)+(compRgb.g<<8)+compRgb.b).toString(16).slice(1);}
  function update(hex){if(!/^#[0-9A-Fa-f]{6}$/.test(hex)){if(/^#[0-9A-Fa-f]{3}$/.test(hex))hex='#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]; else hex='#2DD4BF';}
    document.getElementById('colorPicker').value=hex; document.getElementById('colorPreview').style.backgroundColor=hex; document.getElementById('hexValue').innerText=hex.toUpperCase();
    let rgb=hexToRgb(hex); document.getElementById('rgbValue').innerText=`rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
    let hsl=rgbToHsl(rgb.r,rgb.g,rgb.b); document.getElementById('hslValue').innerText=`hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
    let comp=getComplementary(hex); document.getElementById('compColor').style.backgroundColor=comp; document.getElementById('compHex').innerText=comp.toUpperCase();
  }
  document.getElementById('colorPicker').oninput=e=>update(e.target.value);
  document.getElementById('randomColorBtn').onclick=()=>{let hex='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'); update(hex);};
  document.querySelectorAll('[data-type]').forEach(btn=>btn.onclick=async()=>{let type=btn.dataset.type; let text=document.getElementById(type==='hex'?'hexValue':type==='rgb'?'rgbValue':'hslValue').innerText; await navigator.clipboard.writeText(text); alert('コピーしました');});
  document.getElementById('copyCompBtn').onclick=async()=>{let comp=document.getElementById('compHex').innerText; await navigator.clipboard.writeText(comp); alert('コピーしました');};
  update('#2DD4BF');
</script>
</body>
</html>
