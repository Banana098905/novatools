<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — Markdownライブプレビュー</title>
  <meta name="description" content="Markdownをリアルタイムでプレビュー。見出し、リスト、コードブロックなどに対応。無料・ログイン不要。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <!-- marked.js 軽量Markdownパーサ -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 1100px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    .split-layout { display: flex; gap: 1rem; flex-wrap: wrap; }
    .editor-pane, .preview-pane { flex: 1; min-width: 250px; }
    .pane-title { font-size: 0.7rem; color: #8dcfc3; margin-bottom: 0.3rem; }
    textarea { width: 100%; height: 400px; background: rgba(20,30,40,0.7); border: 1px solid rgba(45,212,191,0.4); border-radius: 1.5rem; padding: 1rem; color: #e0f7f2; font-family: monospace; resize: vertical; }
    .preview-content { background: rgba(20,30,40,0.5); border-radius: 1.5rem; padding: 1rem; height: 400px; overflow-y: auto; color: #e0f7f2; }
    .preview-content h1, .preview-content h2, .preview-content h3 { color: #b3f0e6; margin-top: 0.5rem; margin-bottom: 0.3rem; }
    .preview-content code { background: #1a2f2a; padding: 0.1rem 0.3rem; border-radius: 0.3rem; font-family: monospace; }
    .preview-content pre { background: #1a2f2a; padding: 0.5rem; border-radius: 1rem; overflow-x: auto; }
    .preview-content a { color: #7bd5e8; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">📝 Markdownライブプレビュー</div>
  <div class="split-layout">
    <div class="editor-pane"><div class="pane-title">✏️ エディタ</div><textarea id="markdownInput" placeholder="# 見出し&#10;ここにMarkdownを記述..."></textarea></div>
    <div class="preview-pane"><div class="pane-title">👀 プレビュー</div><div class="preview-content" id="previewArea"></div></div>
  </div>
  <div class="footer-note">リアルタイムプレビュー | 見出し・リスト・コードブロック・リンク対応</div>
</div>
<script>
  const textarea = document.getElementById('markdownInput');
  const preview = document.getElementById('previewArea');
  function updatePreview() {
    const raw = textarea.value;
    const html = marked.parse(raw);
    preview.innerHTML = html;
  }
  textarea.addEventListener('input', updatePreview);
  // サンプルMarkdown
  textarea.value = `# NovaTools Markdown サンプル

## リスト
- 項目1
- 項目2
  - ネスト
## コードブロック
\`\`\`javascript
console.log("Hello, Markdown!");
\`\`\`
## リンク
[NovaTools トップへ](index.html)

> 引用文も使えます。`;
  updatePreview();
</script>
</body>
</html>
