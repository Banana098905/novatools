<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — カレンダー表示 (月間カレンダー)</title>
  <meta name="description" content="シンプルな月間カレンダー。前月/次月の切り替えが可能。無料・ログイン不要。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 700px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin: 1rem 0; }
    .month-year { font-size: 1.2rem; font-weight: 600; color: #e0f7f2; }
    .nav-btn { background: rgba(45,212,191,0.2); border: none; padding: 0.3rem 1rem; border-radius: 2rem; color: #e0f7f2; cursor: pointer; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin: 0.5rem 0; }
    .weekday { font-size: 0.8rem; color: #b3f0e6; padding: 0.3rem; }
    .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.2rem; }
    .day-cell { background: rgba(0,0,0,0.3); border-radius: 0.8rem; padding: 0.6rem; text-align: center; font-size: 0.9rem; color: #e0f7f2; }
    .today { background: #1A8C7A; }
    .other-month { opacity: 0.4; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">📅 シンプルカレンダー</div>
  <div class="calendar-header">
    <button class="nav-btn" id="prevMonthBtn">◀ 前月</button>
    <div class="month-year" id="monthYear"></div>
    <button class="nav-btn" id="nextMonthBtn">翌月 ▶</button>
  </div>
  <div class="weekdays">
    <div class="weekday">月</div><div class="weekday">火</div><div class="weekday">水</div>
    <div class="weekday">木</div><div class="weekday">金</div><div class="weekday">土</div><div class="weekday">日</div>
  </div>
  <div class="calendar-days" id="calendarDays"></div>
  <div class="footer-note">今日の日付は緑色で表示されます</div>
</div>
<script>
  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth();
  function renderCalendar() {
    const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
    const startWeekday = firstDayOfMonth.getDay(); // 0=日曜
    // 月曜始まりに変換 (0=月曜, 6=日曜)
    let startOffset = (startWeekday === 0 ? 6 : startWeekday - 1);
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();
    const days = [];
    for (let i = startOffset - 1; i >= 0; i--) {
      days.push({ day: prevMonthDays - i, isCurrentMonth: false });
    }
    for (let i = 1; i <= daysInMonth; i++) {
      days.push({ day: i, isCurrentMonth: true });
    }
    const remaining = 42 - days.length;
    for (let i = 1; i <= remaining; i++) {
      days.push({ day: i, isCurrentMonth: false });
    }
    const container = document.getElementById('calendarDays');
    container.innerHTML = '';
    const today = new Date();
    const isToday = (y,m,d) => y === today.getFullYear() && m === today.getMonth() && d === today.getDate();
    days.forEach(dayInfo => {
      const div = document.createElement('div');
      div.className = 'day-cell';
      if (!dayInfo.isCurrentMonth) div.classList.add('other-month');
      if (dayInfo.isCurrentMonth && isToday(currentYear, currentMonth, dayInfo.day)) div.classList.add('today');
      div.innerText = dayInfo.day;
      container.appendChild(div);
    });
    document.getElementById('monthYear').innerText = `${currentYear}年 ${currentMonth+1}月`;
  }
  document.getElementById('prevMonthBtn').addEventListener('click', () => {
    if (currentMonth === 0) { currentMonth = 11; currentYear--; }
    else currentMonth--;
    renderCalendar();
  });
  document.getElementById('nextMonthBtn').addEventListener('click', () => {
    if (currentMonth === 11) { currentMonth = 0; currentYear++; }
    else currentMonth++;
    renderCalendar();
  });
  renderCalendar();
</script>
</body>
</html>
