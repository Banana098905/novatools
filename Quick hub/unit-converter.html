<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>単位変換 (長さ・重さ・温度)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; padding:1rem; }
    .glass-card { max-width:600px; width:100%; background:rgba(12,18,28,0.58); backdrop-filter:blur(16px); border-radius:3rem; padding:2rem 1.5rem; box-shadow:0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display:inline-block; margin-bottom:1rem; background:rgba(45,212,191,0.15); color:#8dcfc3; text-decoration:none; padding:0.3rem 1rem; border-radius:2rem; font-size:0.8rem; transition:0.2s; }
    .home-link:hover { background:#2DD4BF; color:#e0f7f2; }
    .brand { text-align:center; font-size:1rem; font-weight:500; background:linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:1rem; }
    .badge { text-align:center; font-size:0.75rem; text-transform:uppercase; letter-spacing:2px; color:#7bd5e8; background:rgba(45,212,191,0.12); display:inline-block; width:auto; margin:0 auto 1rem; padding:0.2rem 1rem; border-radius:3rem; }
    select, input { width:100%; background:rgba(20,30,40,0.7); border:1px solid rgba(45,212,191,0.4); border-radius:2rem; padding:0.7rem; color:#e0f7f2; margin-bottom:0.8rem; }
    .unit-group { display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; }
    .unit-group input { flex:2; margin-bottom:0; }
    .unit-group select { flex:1; margin-bottom:0; }
    .result { background:rgba(0,0,0,0.35); border-radius:1.5rem; padding:1rem; margin-top:1rem; text-align:center; }
    .result-value { font-size:1.8rem; font-weight:700; color:#e0f7f2; }
    .footer-note { text-align:center; font-size:0.6rem; opacity:0.5; margin-top:1rem; color:#8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">📏 単位変換 (長さ・重さ・温度)</div>
  <select id="categorySelect">
    <option value="length">長さ (メートル ⇔ フィート etc.)</option>
    <option value="weight">重さ (キログラム ⇔ ポンド etc.)</option>
    <option value="temp">温度 (摂氏 ⇔ 華氏)</option>
  </select>
  <div class="unit-group">
    <input type="number" id="inputValue" value="1">
    <select id="fromUnit"></select>
    <span style="color:#8dcfc3;">=</span>
    <select id="toUnit"></select>
  </div>
  <div class="result"><div class="result-value" id="result">1.00</div></div>
  <div class="footer-note">リアルタイム変換</div>
</div>
<script>
  const units = {
    length: { m:1, cm:0.01, km:1000, ft:0.3048, in:0.0254, yd:0.9144, mile:1609.34 },
    weight: { kg:1, g:0.001, mg:0.000001, lb:0.453592, oz:0.0283495 },
    temp: { C:1, F:1 }
  };
  const unitNames = { m:'メートル', cm:'センチ', km:'キロ', ft:'フィート', in:'インチ', yd:'ヤード', mile:'マイル', kg:'キログラム', g:'グラム', mg:'ミリグラム', lb:'ポンド', oz:'オンス', C:'摂氏(℃)', F:'華氏(℉)' };
  let category = 'length';
  function updateUnits() {
    const cat = document.getElementById('categorySelect').value;
    category = cat;
    const unitList = Object.keys(units[cat]);
    const fromSelect = document.getElementById('fromUnit');
    const toSelect = document.getElementById('toUnit');
    fromSelect.innerHTML = ''; toSelect.innerHTML = '';
    unitList.forEach(u => { fromSelect.add(new Option(unitNames[u], u)); toSelect.add(new Option(unitNames[u], u)); });
    if(cat==='temp') { fromSelect.value='C'; toSelect.value='F'; } else { fromSelect.value=unitList[0]; toSelect.value=unitList[1]; }
    convert();
  }
  function convert() {
    const val = parseFloat(document.getElementById('inputValue').value) || 0;
    const from = document.getElementById('fromUnit').value;
    const to = document.getElementById('toUnit').value;
    let result;
    if(category === 'temp') {
      if(from==='C' && to==='F') result = val * 9/5 + 32;
      else if(from==='F' && to==='C') result = (val-32) * 5/9;
      else result = val;
    } else {
      const base = val * units[category][from];
      result = base / units[category][to];
    }
    document.getElementById('result').innerText = result.toFixed(4);
  }
  document.getElementById('categorySelect').addEventListener('change', updateUnits);
  document.getElementById('fromUnit').addEventListener('change', convert);
  document.getElementById('toUnit').addEventListener('change', convert);
  document.getElementById('inputValue').addEventListener('input', convert);
  updateUnits();
</script>
</body>
</html>
