<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — パスワード生成 (安全・強力)</title>
  <meta name="description" content="無料で使えるパスワードジェネレーター。長さと文字種を選んで強力なパスワードを即生成。コピーもワンクリック。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 560px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1.2rem; text-align: center; width: fit-content; }
    .password-area { background: rgba(0,0,0,0.45); border-radius: 3rem; padding: 0.3rem 1rem; margin-bottom: 1.5rem; border: 1px solid rgba(45,212,191,0.3); display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; }
    .password-text { font-family: monospace; font-size: 1.3rem; font-weight: 500; color: #e0f7f2; word-break: break-all; flex: 1; text-align: center; padding: 0.8rem 0; }
    .copy-btn { background: #1A8C7A; border: none; padding: 0.5rem 1rem; border-radius: 2rem; color: white; font-weight: 600; cursor: pointer; }
    .options { background: rgba(0,0,0,0.25); border-radius: 2rem; padding: 1rem; margin: 1.2rem 0; }
    .length-control { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; color: #cbece6; }
    .length-control input { background: #1f2e32; border: 1px solid #3f8b7e; border-radius: 2rem; padding: 0.4rem 0.8rem; color: #e0f7f2; width: 80px; text-align: center; }
    .check-group { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin: 1rem 0; }
    .check-group label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #cbece6; cursor: pointer; }
    .generate-btn { background: #1A8C7A; width: 100%; padding: 0.9rem; border-radius: 3rem; font-size: 1rem; font-weight: 600; color: white; cursor: pointer; margin: 0.5rem 0; border: none; }
    .strength { text-align: center; font-size: 0.7rem; margin-top: 0.8rem; color: #6ba89d; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">🔐 強力パスワードジェネレーター</div>
  <div class="password-area"><div class="password-text" id="passwordDisplay">P@ssw0rd!23</div><button class="copy-btn" id="copyBtn">📋 コピー</button></div>
  <div class="options">
    <div class="length-control"><span>🔢 長さ (4〜64)</span><input type="number" id="lengthInput" min="4" max="64" value="16"></div>
    <div class="check-group"><label><input type="checkbox" id="uppercaseCheck" checked> 大文字</label><label><input type="checkbox" id="lowercaseCheck" checked> 小文字</label><label><input type="checkbox" id="numbersCheck" checked> 数字</label><label><input type="checkbox" id="symbolsCheck" checked> 記号</label></div>
    <button class="generate-btn" id="generateBtn">🔄 ランダム生成</button>
    <div class="strength" id="strengthText">⚡ 強力なパスワードを生成しよう</div>
  </div>
  <div class="footer-note">パスワードは端末内で生成 | コピーして安全に保管</div>
</div>
<script>
  const UPPER='ABCDEFGHJKLMNPQRSTUVWXYZ', LOWER='abcdefghijkmnopqrstuvwxyz', NUMBERS='23456789', SYMBOLS='!@#$%&*?+_-';
  function generate(){
    let len=Math.min(64,Math.max(4,parseInt(document.getElementById('lengthInput').value)||16));
    let u=document.getElementById('uppercaseCheck').checked, l=document.getElementById('lowercaseCheck').checked, n=document.getElementById('numbersCheck').checked, s=document.getElementById('symbolsCheck').checked;
    if(!u&&!l&&!n&&!s){document.getElementById('uppercaseCheck').checked=true; document.getElementById('lowercaseCheck').checked=true; document.getElementById('numbersCheck').checked=true; document.getElementById('symbolsCheck').checked=true; return generate();}
    let chars=''; if(u) chars+=UPPER; if(l) chars+=LOWER; if(n) chars+=NUMBERS; if(s) chars+=SYMBOLS;
    let req=[]; if(u) req.push(UPPER[Math.floor(Math.random()*UPPER.length)]); if(l) req.push(LOWER[Math.floor(Math.random()*LOWER.length)]); if(n) req.push(NUMBERS[Math.floor(Math.random()*NUMBERS.length)]); if(s) req.push(SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]);
    let pwd=''; for(let i=0;i<len-req.length;i++) pwd+=chars[Math.floor(Math.random()*chars.length)];
    let full=[...pwd.split(''),...req]; for(let i=full.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[full[i],full[j]]=[full[j],full[i]];}
    let result=full.join('').slice(0,len); document.getElementById('passwordDisplay').innerText=result;
    let score=0; if(len>=12) score++; if(len>=16) score++; if(u&&l) score++; if(n) score++; if(s) score++; if(len>=20) score++;
    let msg=score>=5?'💪 非常に強力':(score>=3?'👍 強力 (セキュア)':'⚠️ 弱い・文字種を増やして長くしよう');
    document.getElementById('strengthText').innerHTML=`🛡️ ${msg}`;
  }
  document.getElementById('generateBtn').onclick=generate;
  document.getElementById('copyBtn').onclick=async()=>{let pwd=document.getElementById('passwordDisplay').innerText; await navigator.clipboard.writeText(pwd); alert('コピーしました');};
  generate();
</script>
</body>
</html>
