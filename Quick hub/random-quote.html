<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — ランダム名言・ジョーク生成</title>
  <meta name="description" content="ランダムな名言やジョークを表示。1クリックで新しい言葉に出会える。無料・ログイン不要。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 600px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    .quote-area { background: rgba(0,0,0,0.35); border-radius: 2rem; padding: 2rem 1.5rem; margin: 1rem 0; text-align: center; min-height: 200px; display: flex; flex-direction: column; justify-content: center; }
    .quote-text { font-size: 1.2rem; line-height: 1.5; color: #e0f7f2; margin-bottom: 1rem; }
    .quote-author { font-size: 0.85rem; color: #b3f0e6; }
    .mode-switch { display: flex; gap: 0.8rem; justify-content: center; margin-bottom: 1rem; }
    .mode-btn { background: rgba(30,40,50,0.8); border: none; padding: 0.4rem 1rem; border-radius: 2rem; color: #e0f7f2; cursor: pointer; }
    .mode-btn.active { background: #1A8C7A; }
    .generate-btn { background: #1A8C7A; width: 100%; padding: 0.8rem; border-radius: 3rem; font-size: 1rem; font-weight: 600; color: white; cursor: pointer; border: none; margin-top: 1rem; }
    .copy-btn { background: #2d5f66; border: none; padding: 0.4rem 1rem; border-radius: 2rem; color: white; cursor: pointer; margin-top: 0.5rem; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">💬 ランダム名言 / ジョーク</div>
  <div class="mode-switch">
    <button class="mode-btn active" data-mode="quote">📖 名言</button>
    <button class="mode-btn" data-mode="joke">😄 ジョーク</button>
  </div>
  <div class="quote-area">
    <div class="quote-text" id="quoteText">「ボタンを押すと名言が表示されます」</div>
    <div class="quote-author" id="quoteAuthor"></div>
    <button class="copy-btn" id="copyBtn">📋 コピー</button>
  </div>
  <button class="generate-btn" id="generateBtn">✨ ランダムに表示</button>
  <div class="footer-note">1クリックで新しい言葉に出会える | コピーしてSNSでシェア</div>
</div>
<script>
  const quotes = [
    { text: "人生とは自転車のようなものだ。倒れないために走り続けなければならない。", author: "アインシュタイン" },
    { text: "明日できることを今日やるな。", author: "マーク・トウェイン" },
    { text: "チャンスは準備ができている人に訪れる。", author: "パスツール" },
    { text: "失敗は成功の母。", author: "ことわざ" },
    { text: "やると決めたら、もう迷わない。", author: "孫正義" },
    { text: "小さなことを積み重ねるのが、とんでもないところへ行くただ一つの道。", author: "イチロー" },
    { text: "夢は逃げない。逃げるのはいつも自分だ。", author: "佚名" }
  ];
  const jokes = [
    { text: "プログラマーがスーパーに行くと、\"牛乳を買ってきたら卵があれば6個買って来て\"と言われた。結果、彼は牛乳を6個買って帰った。", author: "プログラマーあるある" },
    { text: "なぜプログラマーはハロウィンを間違えるのか？　Oct 31 と Dec 25 を混同するから。", author: "ジョーク" },
    { text: "SQLクエリはバーに入った。2つのテーブルに座って、JOINを始めた。", author: "DBジョーク" },
    { text: "「バグを直してください」「再現できないんですけど」「じゃあ直せません」", author: "開発現場" },
    { text: "キーボードの任意のキーを押してください…「どこでもいいよ」", author: "PCあるある" },
    { text: "ゼロ除算エラー: ケーキを0人で分けることはできません。", author: "数学ジョーク" }
  ];
  let currentMode = "quote";
  function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function updateDisplay() {
    const items = currentMode === "quote" ? quotes : jokes;
    const item = getRandomItem(items);
    document.getElementById('quoteText').innerText = item.text;
    document.getElementById('quoteAuthor').innerText = `— ${item.author}`;
  }
  document.getElementById('generateBtn').addEventListener('click', updateDisplay);
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const text = document.getElementById('quoteText').innerText;
    const author = document.getElementById('quoteAuthor').innerText;
    const full = `${text}\n${author}`;
    await navigator.clipboard.writeText(full);
    alert('コピーしました');
  });
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.getAttribute('data-mode');
      updateDisplay();
    });
  });
  updateDisplay();
</script>
</body>
</html>
