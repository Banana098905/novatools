<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BMI計算機</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; padding:1rem; }
    .glass-card { max-width:500px; width:100%; background:rgba(12,18,28,0.58); backdrop-filter:blur(16px); border-radius:3rem; padding:2rem 1.5rem; }
    .home-link { display:inline-block; margin-bottom:1rem; background:rgba(45,212,191,0.15); color:#8dcfc3; text-decoration:none; padding:0.3rem 1rem; border-radius:2rem; font-size:0.8rem; }
    .brand { text-align:center; font-size:1rem; background:linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:1rem; }
    .badge { text-align:center; font-size:0.75rem; background:rgba(45,212,191,0.12); display:inline-block; width:auto; margin:0 auto 1rem; padding:0.2rem 1rem; border-radius:3rem; color:#7bd5e8; }
    input, select { width:100%; background:rgba(20,30,40,0.7); border:1px solid rgba(45,212,191,0.4); border-radius:1.5rem; padding:0.7rem; color:#e0f7f2; margin-bottom:0.8rem; }
    .result { background:rgba(0,0,0,0.35); border-radius:1.5rem; padding:1rem; text-align:center; margin-top:1rem; }
    .bmi-value { font-size:2rem; font-weight:700; color:#e0f7f2; }
    .footer-note { text-align:center; font-size:0.6rem; opacity:0.5; margin-top:1rem; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">⚖️ BMI計算機</div>
  <input type="number" id="height" placeholder="身長" step="0.1">
  <select id="heightUnit"><option value="cm">cm</option><option value="m">m</option></select>
  <input type="number" id="weight" placeholder="体重" step="0.1">
  <select id="weightUnit"><option value="kg">kg</option><option value="lb">lb</option></select>
  <div class="result"><div class="bmi-value" id="bmi">--</div><div id="judge"></div></div>
  <div class="footer-note">BMI = 体重(kg) ÷ 身長(m)²</div>
</div>
<script>
  function calc() {
    let height = parseFloat(document.getElementById('height').value);
    let weight = parseFloat(document.getElementById('weight').value);
    if(isNaN(height) || isNaN(weight)) { document.getElementById('bmi').innerText = '--'; document.getElementById('judge').innerText = ''; return; }
    if(document.getElementById('heightUnit').value === 'cm') height /= 100;
    if(document.getElementById('weightUnit').value === 'lb') weight *= 0.453592;
    let bmi = weight / (height * height);
    document.getElementById('bmi').innerText = bmi.toFixed(1);
    let judge = '';
    if(bmi < 18.5) judge = '低体重 (やせ型)';
    else if(bmi < 25) judge = '普通体重';
    else if(bmi < 30) judge = '肥満 (1度)';
    else judge = '肥満 (2度以上)';
    document.getElementById('judge').innerText = judge;
  }
  ['height','weight','heightUnit','weightUnit'].forEach(id => document.getElementById(id).addEventListener('input', calc));
  calc();
</script>
</body>
</html>
