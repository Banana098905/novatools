<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>NovaTools — IPアドレス確認 (自分のグローバルIP)</title>
  <meta name="description" content="現在のグローバルIPアドレスを表示。IPv4/IPv6対応。無料・ログイン不要。">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans JP', sans-serif; padding: 1rem; }
    .glass-card { max-width: 560px; width: 100%; background: rgba(12,18,28,0.58); backdrop-filter: blur(16px); border-radius: 3rem; padding: 2rem 1.5rem 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display: inline-block; margin-bottom: 1rem; background: rgba(45,212,191,0.15); color: #8dcfc3; text-decoration: none; padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; transition: 0.2s; }
    .home-link:hover { background: #2DD4BF; color: #e0f7f2; }
    .brand { text-align: center; font-size: 1rem; font-weight: 500; background: linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem; }
    .badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #7bd5e8; background: rgba(45,212,191,0.12); display: inline-block; padding: 0.2rem 1rem; border-radius: 3rem; margin: 0 auto 1rem; text-align: center; width: fit-content; }
    .ip-display { background: rgba(0,0,0,0.35); border-radius: 2rem; padding: 2rem; text-align: center; margin: 1rem 0; }
    .ip-address { font-size: 2rem; font-weight: 700; color: #e0f7f2; font-family: monospace; word-break: break-all; }
    .ip-label { font-size: 0.8rem; color: #b3f0e6; margin-bottom: 0.5rem; }
    .refresh-btn { background: #1A8C7A; border: none; padding: 0.6rem 1.2rem; border-radius: 2rem; color: white; cursor: pointer; margin-top: 1rem; }
    .footer-note { text-align: center; font-size: 0.6rem; opacity: 0.5; margin-top: 1rem; color: #8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">🌐 IPアドレス確認</div>
  <div class="ip-display">
    <div class="ip-label">現在のグローバルIPアドレス</div>
    <div class="ip-address" id="ipAddress">読み込み中...</div>
    <button class="refresh-btn" id="refreshBtn">🔄 再読み込み</button>
  </div>
  <div class="footer-note">IPv4 / IPv6 対応 | 接続しているネットワークのIPを表示</div>
</div>
<script>
  async function fetchIP() {
    const ipDiv = document.getElementById('ipAddress');
    ipDiv.innerText = '読み込み中...';
    try {
      // ipify.org の無料APIを使用 (レート制限緩め)
      const response = await fetch('https://api.ipify.org?format=json');
      const data = await response.json();
      ipDiv.innerText = data.ip;
    } catch (error) {
      ipDiv.innerText = '取得に失敗しました';
      console.error(error);
    }
  }
  document.getElementById('refreshBtn').addEventListener('click', fetchIP);
  fetchIP();
</script>
</body>
</html>
