<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>簡易計算機</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; padding:1rem; }
    .glass-card { max-width:400px; width:100%; background:rgba(12,18,28,0.58); backdrop-filter:blur(16px); border-radius:3rem; padding:1.5rem; }
    .home-link { display:inline-block; margin-bottom:1rem; background:rgba(45,212,191,0.15); color:#8dcfc3; text-decoration:none; padding:0.3rem 1rem; border-radius:2rem; font-size:0.8rem; }
    .brand { text-align:center; font-size:1rem; background:linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:1rem; }
    .display { background:rgba(0,0,0,0.4); border-radius:1.5rem; padding:1rem; text-align:right; font-size:2rem; font-weight:600; color:#e0f7f2; margin-bottom:1rem; word-break:break-all; }
    .buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; }
    button { background:#1A8C7A; border:none; padding:1rem; border-radius:1rem; color:white; font-size:1.2rem; cursor:pointer; }
    button.operator { background:#2d5f66; }
    button.clear { background:#8f5e4a; }
    .footer-note { text-align:center; font-size:0.6rem; opacity:0.5; margin-top:1rem; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button class="clear">AC</button><button class="operator">±</button><button class="operator">%</button><button class="operator">÷</button>
    <button>7</button><button>8</button><button>9</button><button class="operator">×</button>
    <button>4</button><button>5</button><button>6</button><button class="operator">−</button>
    <button>1</button><button>2</button><button>3</button><button class="operator">+</button>
    <button>0</button><button>.</button><button class="operator">=</button>
  </div>
  <div class="footer-note">簡易計算機</div>
</div>
<script>
  let current = '0', previous = null, operator = null, waiting = false;
  const display = document.getElementById('display');
  function updateDisplay() { display.innerText = current; }
  function inputNumber(num) {
    if(waiting) { current = ''; waiting = false; }
    if(current === '0' && num !== '.') current = num;
    else current += num;
    updateDisplay();
  }
  function inputDot() { if(!current.includes('.')) current += '.'; updateDisplay(); }
  function clearAll() { current = '0'; previous = null; operator = null; waiting = false; updateDisplay(); }
  function toggleSign() { current = (parseFloat(current) * -1).toString(); updateDisplay(); }
  function percent() { current = (parseFloat(current) / 100).toString(); updateDisplay(); }
  function setOperator(op) {
    if(operator && !waiting) calculate();
    previous = parseFloat(current);
    operator = op;
    waiting = true;
  }
  function calculate() {
    if(operator === null || previous === null) return;
    let result;
    switch(operator) {
      case '+': result = previous + parseFloat(current); break;
      case '−': result = previous - parseFloat(current); break;
      case '×': result = previous * parseFloat(current); break;
      case '÷': result = previous / parseFloat(current); break;
      default: return;
    }
    current = result.toString();
    operator = null;
    waiting = true;
    updateDisplay();
  }
  document.querySelectorAll('.buttons button').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.innerText;
      if(!isNaN(text) || text === '0') inputNumber(text);
      else if(text === '.') inputDot();
      else if(text === 'AC') clearAll();
      else if(text === '±') toggleSign();
      else if(text === '%') percent();
      else if(text === '=') calculate();
      else if(['+','−','×','÷'].includes(text)) setOperator(text);
    });
  });
</script>
</body>
</html>
