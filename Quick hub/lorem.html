<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lorem Ipsum 生成</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background: radial-gradient(ellipse at 30% 40%, #0C0F17, #020408); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; padding:1rem; }
    .glass-card { max-width:700px; width:100%; background:rgba(12,18,28,0.58); backdrop-filter:blur(16px); border-radius:3rem; padding:2rem 1.5rem; box-shadow:0 2px 8px rgba(0,0,0,0.1), 0 0 0 1px rgba(45,212,191,0.12); }
    .home-link { display:inline-block; margin-bottom:1rem; background:rgba(45,212,191,0.15); color:#8dcfc3; text-decoration:none; padding:0.3rem 1rem; border-radius:2rem; font-size:0.8rem; transition:0.2s; }
    .home-link:hover { background:#2DD4BF; color:#e0f7f2; }
    .brand { text-align:center; font-size:1rem; font-weight:500; background:linear-gradient(120deg,#b0f3e8,#5ee0d0); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:1rem; }
    .badge { text-align:center; font-size:0.75rem; text-transform:uppercase; letter-spacing:2px; color:#7bd5e8; background:rgba(45,212,191,0.12); display:inline-block; width:auto; margin:0 auto 1rem; padding:0.2rem 1rem; border-radius:3rem; }
    label { font-size:0.7rem; color:#cbece6; display:block; margin-bottom:0.2rem; }
    input { width:100%; background:rgba(20,30,40,0.7); border:1px solid rgba(45,212,191,0.4); border-radius:2rem; padding:0.6rem; color:#e0f7f2; margin-bottom:1rem; }
    .btn-group { display:flex; gap:1rem; justify-content:center; margin:1rem 0; }
    button { background:#1A8C7A; border:none; padding:0.6rem 1.2rem; border-radius:2rem; color:white; cursor:pointer; font-weight:600; transition:0.2s; }
    button:hover { background:#2BBBA5; transform:translateY(-2px); }
    .result { background:rgba(0,0,0,0.35); border-radius:1.5rem; padding:1rem; max-height:300px; overflow-y:auto; white-space:pre-wrap; font-size:0.8rem; color:#e0f7f2; }
    .footer-note { text-align:center; font-size:0.6rem; opacity:0.5; margin-top:1rem; color:#8db3c0; }
  </style>
</head>
<body>
<div class="glass-card">
  <a href="index.html" class="home-link">← ホームに戻る</a>
  <div class="brand">✦ NOVATOOLS ✦</div>
  <div class="badge">📝 ダミーテキスト生成 (Lorem Ipsum)</div>
  <label>段落数</label>
  <input type="number" id="paragraphs" value="3" min="1" max="10">
  <div class="btn-group"><button id="generateBtn">生成</button><button id="copyBtn">コピー</button></div>
  <div class="result" id="output">--</div>
  <div class="footer-note">デザイン・レイアウト確認用</div>
</div>
<script>
  const lipsum = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.";
  function generate(paraCount) {
    let result = '';
    for(let i=0; i<paraCount; i++) result += `<p>${lipsum}</p>`;
    return result;
  }
  const output = document.getElementById('output');
  document.getElementById('generateBtn').onclick = () => {
    const count = parseInt(document.getElementById('paragraphs').value) || 3;
    output.innerHTML = generate(count);
  };
  document.getElementById('copyBtn').onclick = async () => { await navigator.clipboard.writeText(output.innerText); alert('コピーしました'); };
  document.getElementById('generateBtn').click();
</script>
</body>
</html>
